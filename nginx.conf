# GO OIL DMS — nginx config for the frontend container
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/octet-stream text/javascript
               application/vnd.ms-fontobject application/x-font-ttf font/opentype
               image/svg+xml;

    # Long cache for static assets (hashed filenames)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA fallback — everything else serves index.html
    location / {
        try_files $uri /index.html;
    }

    # Health probe target
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
